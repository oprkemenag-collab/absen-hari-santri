<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Hari Santri 2026 - Kemenag</title>
    <!-- Menggunakan Bootstrap 5 untuk tampilan yang rapi dan responsif -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            min-height: 100vh;
        }
        .card {
            border: none;
            border-radius: 1rem;
        }
        .card-header {
            background: linear-gradient(135deg, #047857 0%, #065f46 100%);
            border-radius: 1rem 1rem 0 0 !important;
            padding: 1.5rem;
        }
        .btn-success {
            background-color: #047857;
            border-color: #047857;
        }
        .btn-success:hover {
            background-color: #065f46;
            border-color: #065f46;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card shadow-lg">
                    <div class="card-header text-white text-center">
                        <h4 class="mb-1 fw-bold">ABSENSI HARI SANTRI 2026</h4>
                        <p class="mb-1">Kementerian Agama Republik Indonesia</p>
                        <small class="badge bg-light text-success px-3 py-1 mt-1">22 Oktober 2026</small>
                    </div>
                    <div class="card-body p-4">
                        <form id="formAbsen">
                            <div class="mb-3">
                                <label for="nama" class="form-label fw-semibold">Nama Lengkap & Gelar</label>
                                <input type="text" class="form-control" id="nama" placeholder="Contoh: Drs. H. Ahmad Fauzi, M.Pd." required>
                            </div>

                            <div class="mb-3">
                                <label for="nip" class="form-label fw-semibold">NIP / Nomor Identitas Pegawai</label>
                                <input type="text" class="form-control" id="nip" placeholder="Masukkan NIP atau Nomor Identitas" required>
                            </div>

                            <div class="mb-3">
                                <label for="satker" class="form-label fw-semibold">Satuan Kerja (Satker) / Instansi</label>
                                <select class="form-select" id="satker" required>
                                    <option value="" selected disabled>-- Pilih Instansi / Satker --</option>
                                    <option value="Kantor Kementerian Agama">Kantor Kementerian Agama</option>
                                    <option value="KUA Kecamatan">KUA Kecamatan</option>
                                    <option value="MAN (Madrasah Aliyah Negeri)">MAN (Madrasah Aliyah Negeri)</option>
                                    <option value="MTsN (Madrasah Tsanawiyah Negeri)">MTsN (Madrasah Tsanawiyah Negeri)</option>
                                    <option value="MIN (Madrasah Ibtidaiyah Negeri)">MIN (Madrasah Ibtidaiyah Negeri)</option>
                                    <option value="Madrasah Swasta / Pesantren">Madrasah Swasta / Pesantren</option>
                                    <option value="Lainnya">Lainnya</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="unit_kerja" class="form-label fw-semibold">Nama Kantor / Madrasah / Unit</label>
                                <input type="text" class="form-control" id="unit_kerja" placeholder="Contoh: KUA Kec. Gubeng / MAN 1 Kota..." required>
                            </div>

                            <div class="mb-3">
                                <label for="keterangan" class="form-label fw-semibold">Keterangan Kehadiran</label>
                                <select class="form-select" id="keterangan" required>
                                    <option value="Hadir">Hadir Apel / Upacara</option>
                                    <option value="Tugas Kedinasan">Tugas Kedinasan</option>
                                    <option value="Izin">Izin</option>
                                    <option value="Sakit">Sakit</option>
                                </select>
                            </div>
                            
                            <!-- Indikator Deteksi Lokasi -->
                            <div class="mb-3 p-3 bg-white border rounded shadow-sm">
                                <label class="form-label fw-bold mb-1 text-success">Status Lokasi GPS:</label>
                                <div id="statusLokasi" class="form-text text-muted">Meminta izin akses lokasi...</div>
                            </div>

                            <button type="submit" class="btn btn-success w-100 py-2 fw-bold" id="btnKirim">Kirim Daftar Hadir</button>
                        </form>
                        
                        <!-- Kotak Informasi Berhasil / Gagal -->
                        <div id="alertBox" class="mt-3"></div>
                    </div>
                </div>
                <div class="text-center mt-3 text-muted small">
                    &copy; 2026 Sistem Kehadiran Elektronik - Kementerian Agama RI
                </div>
            </div>
        </div>
    </div>

    <script>
        // URL Web App Google Apps Script Anda
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzi-qY0lci8jNJmEwLaDICiLg4gAFGt6eKyU7yCi6PHrNPC1FaWwmL5Vnv3vO0puGH0cw/exec";

        const form = document.getElementById('formAbsen');
        const btnKirim = document.getElementById('btnKirim');
        const alertBox = document.getElementById('alertBox');
        const statusLokasi = document.getElementById('statusLokasi');

        let userLat = "Tidak diizinkan";
        let userLon = "Tidak diizinkan";

        // Mengambil lokasi otomatis saat halaman dibuka
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    userLat = position.coords.latitude;
                    userLon = position.coords.longitude;
                    statusLokasi.innerHTML = '<span class="text-success fw-bold">✔ Lokasi GPS berhasil diverifikasi.</span>';
                },
                function(error) {
                    statusLokasi.innerHTML = '<span class="text-danger fw-bold">✖ Akses lokasi ditolak. Absen tetap bisa dikirim tanpa titik koordinat.</span>';
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        } else {
            statusLokasi.innerHTML = '<span class="text-danger">Browser Anda tidak mendukung deteksi lokasi.</span>';
        }

        // Proses saat tombol submit/kirim ditekan
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            btnKirim.disabled = true;
            btnKirim.innerText = 'Mengirim data...';

            const data = {
                nama: document.getElementById('nama').value + " (NIP: " + document.getElementById('nip').value + ")",
                kelas: document.getElementById('satker').value + " - " + document.getElementById('unit_kerja').value,
                keterangan: document.getElementById('keterangan').value,
                latitude: userLat,
                longitude: userLon
            };

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(() => {
                alertBox.innerHTML = '<div class="alert alert-success">Kehadiran berhasil dikirim! Terima kasih atas pengabdian Anda.</div>';
                form.reset();
                btnKirim.disabled = false;
                btnKirim.innerText = 'Kirim Daftar Hadir';
            })
            .catch(error => {
                alertBox.innerHTML = '<div class="alert alert-danger">Terjadi kesalahan koneksi. Silakan coba lagi.</div>';
                btnKirim.disabled = false;
                btnKirim.innerText = 'Kirim Daftar Hadir';
            });
        });
    </script>
</body>
</html>

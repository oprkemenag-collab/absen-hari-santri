<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Hari Santri 2026</title>
    <!-- Menggunakan Bootstrap 5 untuk tampilan yang rapi dan responsif -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-success text-white text-center">
                        <h4>Absensi Hari Santri 2026</h4>
                        <p class="mb-0">22 Oktober 2026</p>
                    </div>
                    <div class="card-body">
                        <form id="formAbsen">
                            <div class="mb-3">
                                <label for="nama" class="form-label">Nama Lengkap</label>
                                <input type="text" class="form-control" id="nama" placeholder="Masukkan nama lengkap Anda" required>
                            </div>
                            <div class="mb-3">
                                <label for="kelas" class="form-label">Kelas / Rombongan</label>
                                <input type="text" class="form-control" id="kelas" placeholder="Contoh: 3 Aliyah / Majelis A" required>
                            </div>
                            <div class="mb-3">
                                <label for="keterangan" class="form-label">Keterangan Kehadiran</label>
                                <select class="form-select" id="keterangan" required>
                                    <option value="Hadir">Hadir</option>
                                    <option value="Izin">Izin</option>
                                    <option value="Sakit">Sakit</option>
                                </select>
                            </div>
                            
                            <!-- Indikator Deteksi Lokasi -->
                            <div class="mb-3 p-2 bg-white border rounded">
                                <label class="form-label fw-bold mb-1">Status Lokasi GPS:</label>
                                <div id="statusLokasi" class="form-text text-muted">Meminta izin akses lokasi...</div>
                            </div>

                            <button type="submit" class="btn btn-success w-100 py-2" id="btnKirim">Kirim Kehadiran</button>
                        </form>
                        
                        <!-- Kotak Informasi Berhasil / Gagal -->
                        <div id="alertBox" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // GANTI URL DI BAWAH INI DENGAN URL WEB APP ANDA
        // ==========================================
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzi-qY0lci8jNJmEwLaDICiLg4gAFGt6eKyU7yCi6PHrNPC1FaWwmL5Vnv3vO0puGH0cw/exec";

        const form = document.getElementById('formAbsen');
        const btnKirim = document.getElementById('btnKirim');
        const alertBox = document.getElementById('alertBox');
        const statusLokasi = document.getElementById('statusLokasi');

        let userLat = "Tidak diizinkan";
        let userLon = "Tidak diizinkan";

        // Mengambil lokasi otomatis saat halaman dibuka
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    userLat = position.coords.latitude;
                    userLon = position.coords.longitude;
                    statusLokasi.innerHTML = '<span class="text-success fw-bold">✔ Lokasi berhasil terdeteksi.</span>';
                },
                function(error) {
                    statusLokasi.innerHTML = '<span class="text-danger fw-bold">✖ Akses lokasi ditolak. Absen tetap bisa dikirim tanpa titik koordinat.</span>';
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        } else {
            statusLokasi.innerHTML = '<span class="text-danger">Browser Anda tidak mendukung deteksi lokasi.</span>';
        }

        // Proses saat tombol submit/kirim ditekan
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            btnKirim.disabled = true;
            btnKirim.innerText = 'Mengirim data...';

            const data = {
                nama: document.getElementById('nama').value,
                kelas: document.getElementById('kelas').value,
                keterangan: document.getElementById('keterangan').value,
                latitude: userLat,
                longitude: userLon
            };

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(() => {
                alertBox.innerHTML = '<div class="alert alert-success">Absensi berhasil dikirim! Terima kasih.</div>';
                form.reset();
                btnKirim.disabled = false;
                btnKirim.innerText = 'Kirim Kehadiran';
            })
            .catch(error => {
                alertBox.innerHTML = '<div class="alert alert-danger">Terjadi kesalahan koneksi. Silakan coba lagi.</div>';
                btnKirim.disabled = false;
                btnKirim.innerText = 'Kirim Kehadiran';
            });
        });
    </script>
</body>
</html>
